name: Zoledronic acid
alsoKnownAs:
- Aclasta
- Zometa
medicineType: Bisphosphonate (bone-strengthening medicine)
forms:
- drip into a vein (infusion)
availability: hospital
summary: Zoledronic acid strengthens bones. It is given as a drip once a year for osteoporosis, or more often for bone problems caused by cancer.
conditions:
- musculoskeletal/osteoporosis
uses:
- Osteoporosis, once a year (Aclasta)
- Paget's disease of bone
- Preventing bone problems caused by cancer that has spread to the bone, and high calcium caused by cancer (Zometa)
offLabel:
- Lowering the chance of some breast cancers coming back after the menopause
howItWorks: Zoledronic acid slows down the cells that break down bone. This allows bone-building cells to catch up, making bones denser and less likely to break.
sideEffectsCommon:
- flu-like symptoms for 1 to 3 days after the first drip
- muscle and joint pain
- headache
- high temperature
- feeling sick
sideEffectsSerious:
- jaw pain, a loose tooth or a mouth sore that does not heal
- new pain in your thigh, hip or groin
- eye pain or redness
- peeing much less than usual
stopping: There is no withdrawal. Its effect on bone lasts a long time. Your doctor may suggest a treatment break after 3 years, depending on your fracture risk.
stoppingRisk: low
warnings:
- You will have a kidney blood test before each drip.
- Have a dental check-up before starting, and look after your teeth.
- Drink plenty of fluids on the day of the drip.
- Make sure you get enough calcium and vitamin D.
lastReviewed: '2026-10-05'
