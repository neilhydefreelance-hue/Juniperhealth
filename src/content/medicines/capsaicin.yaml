name: Capsaicin
alsoKnownAs:
- Zacin
- Axsain
- Qutenza
medicineType: Topical painkiller made from chilli peppers
forms:
- cream
- skin patches (given in hospital)
summary: Capsaicin is the substance that makes chilli peppers hot. As a cream or patch it can ease joint pain and nerve pain.
conditions:
- musculoskeletal/osteoarthritis
uses:
- Pain from osteoarthritis (cream)
- Nerve pain after shingles (postherpetic neuralgia) and diabetic nerve pain (cream or high-strength patches)
- Other localised nerve pain (high-strength patches, in a pain clinic)
offLabel: []
howItWorks: Capsaicin first stimulates pain nerves in the skin, which causes a burning feeling. With regular use, it reduces a chemical called substance P and makes these nerves less sensitive, so they send fewer pain signals.
sideEffectsCommon:
- burning or stinging where it is applied in the first few weeks
- redness of the skin
sideEffectsSerious:
- severe burning, blistering or swelling of the skin
- coughing or breathing problems if the cream is breathed in
stopping: Capsaicin does not cause withdrawal symptoms. Pain may slowly return after stopping.
stoppingRisk: low
warnings:
- Wash your hands well after using the cream and keep it away from your eyes, nose and mouth.
- Do not use it on broken or irritated skin.
- It can take 2 to 4 weeks of regular use to work.
lastReviewed: '2026-10-05'
