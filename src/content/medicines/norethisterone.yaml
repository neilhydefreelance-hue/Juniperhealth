name: Norethisterone
alsoKnownAs:
- Primolut N
- Utovlan
- Noriday
- Micronor
medicineType: Progestogen hormone
forms:
- tablets
summary: Norethisterone is a hormone tablet. It is used to delay or control periods, and to treat endometriosis and heavy bleeding.
conditions:
- kidney-bladder-and-reproductive/endometriosis
uses:
- Delaying a period (for example, for a holiday)
- Heavy or irregular periods
- Endometriosis
- Contraception (lower dose progestogen-only pill)
- Part of some hormone replacement therapy (HRT)
offLabel: []
howItWorks: Norethisterone is a man-made version of progesterone. It keeps the lining of the womb stable, which stops it shedding and so delays or controls bleeding. Over time, it can also shrink patches of endometriosis.
sideEffectsCommon:
- bloating
- breast tenderness
- headache
- feeling sick
- mood changes
- spotting or irregular bleeding
sideEffectsSerious:
- pain, swelling or warmth in one leg, chest pain or sudden breathlessness, which can be signs of a blood clot. Call 999
- a sudden severe headache or problems with vision or speech
- yellowing of the skin or eyes
stopping: Norethisterone does not cause withdrawal. A period usually starts 2 to 3 days after stopping.
stoppingRisk: low
warnings:
- Higher doses used to delay periods are not a contraceptive.
- It is not suitable if you have had a blood clot, unless a specialist advises it.
nhsSlug: norethisterone
lastReviewed: '2026-10-05'
