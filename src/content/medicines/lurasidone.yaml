name: Lurasidone
alsoKnownAs:
- Latuda
medicineType: Atypical antipsychotic
forms:
- tablets
availability: specialist
summary: Lurasidone is an antipsychotic used to treat schizophrenia. It is less likely than some antipsychotics to cause weight gain.
conditions:
- mental-health/schizophrenia
uses:
- Schizophrenia in adults and young people aged 13 and over
offLabel:
- Depression in bipolar disorder
howItWorks: Lurasidone blocks dopamine and serotonin receptors in the brain. This helps reduce symptoms such as hearing voices, unusual beliefs and disordered thinking.
sideEffectsCommon:
- feeling sleepy
- feeling restless or unable to sit still
- feeling sick
- shaking
- stiffness
- trouble sleeping
sideEffectsSerious:
- a high temperature with stiff muscles, sweating and confusion (neuroleptic malignant syndrome). Call 999
- uncontrolled movements of the face, tongue or body
- thoughts of harming yourself
- a fast or irregular heartbeat
stopping: Stopping suddenly can cause withdrawal symptoms such as feeling sick, sweating and trouble sleeping, and greatly increases the risk of psychosis coming back. Your team will reduce the dose slowly if it needs to stop.
stoppingRisk: high
warnings:
- Take it with food, as this helps the body absorb it.
- Avoid grapefruit juice.
- Your weight, blood sugar and cholesterol will be checked regularly.
lastReviewed: '2026-10-05'
