name: Clomifene
alsoKnownAs:
- Clomiphene
- Clomid
medicineType: Fertility medicine (ovulation stimulant)
forms:
- tablets
availability: specialist
summary: Clomifene is a fertility medicine. It helps women and people with ovaries who do not ovulate regularly to release an egg.
conditions:
- metabolic-and-hormonal/pcos
uses:
- Infertility caused by not ovulating regularly, including in polycystic ovary syndrome (PCOS)
offLabel:
- Some types of male infertility caused by low hormone levels, under a specialist
howItWorks: Clomifene blocks oestrogen receptors in the brain. The brain responds by releasing more of the hormones that stimulate the ovaries to develop and release an egg.
sideEffectsCommon:
- hot flushes
- tummy discomfort or bloating
- feeling sick
- headache
- breast tenderness
- mood swings
sideEffectsSerious:
- blurred vision, spots or flashes in your vision. Stop and contact your doctor
- severe tummy pain or swelling, breathlessness or peeing less, which can be signs of ovarian hyperstimulation syndrome
stopping: Clomifene is taken for 5 days in each cycle, usually for no more than 6 cycles. There are no withdrawal symptoms.
stoppingRisk: low
warnings:
- It increases the chance of twins.
- You should have scans to check how your ovaries are responding, at least in the first cycle.
- It is usually started by a fertility specialist.
lastReviewed: '2026-10-05'
