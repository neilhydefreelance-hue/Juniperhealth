name: Atorvastatin
alsoKnownAs:
- Lipitor
medicineType: Statin (cholesterol-lowering medicine)
forms:
- tablets
- chewable tablets
summary: Atorvastatin is a statin. It lowers cholesterol and reduces your risk of a heart attack or stroke.
conditions:
- heart-and-circulation/high-cholesterol
- heart-and-circulation/coronary-heart-disease
- heart-and-circulation/stroke
- metabolic-and-hormonal/type-2-diabetes
uses:
- High cholesterol
- Preventing heart attacks and strokes in people at higher risk, including people with diabetes or kidney disease
- After a heart attack or stroke
offLabel: []
howItWorks: Atorvastatin blocks an enzyme in the liver called HMG-CoA reductase, which the body uses to make cholesterol. Lower production means the liver removes more LDL ("bad") cholesterol from the blood. Statins also help stabilise fatty deposits in arteries.
sideEffectsCommon:
- headache
- muscle aches
- feeling sick
- indigestion
- diarrhoea or constipation
- cold-like symptoms
sideEffectsSerious:
- unexplained muscle pain, tenderness or weakness, especially with a high temperature or dark pee
- yellowing of the skin or eyes
- severe stomach pain
stopping: Atorvastatin does not cause withdrawal symptoms, but your cholesterol will rise again within weeks and your risk of a heart attack or stroke goes back up.
stoppingRisk: low
warnings:
- Avoid large amounts of grapefruit juice.
- Tell your doctor about muscle pain. It is often not caused by the statin, but it should be checked.
- Do not take it if you are pregnant or breastfeeding.
nhsSlug: atorvastatin
lastReviewed: '2026-10-05'
