name: Hydrochlorothiazide
alsoKnownAs:
- Co-amilozide (with amiloride)
- Co-zidocapt (with captopril)
medicineType: Thiazide diuretic (water tablet)
forms:
- tablets
- combination tablets
summary: Hydrochlorothiazide is a mild water tablet used to lower blood pressure. In the UK it is mostly given combined with another blood pressure medicine.
conditions:
- heart-and-circulation/high-blood-pressure
- heart-and-circulation/heart-failure
uses:
- High blood pressure, usually in a combination tablet
- Fluid build-up (oedema), including in heart failure
offLabel:
- Preventing some types of kidney stone
howItWorks: Hydrochlorothiazide stops part of the kidney reabsorbing salt, so more salt and water leave the body in your pee. Over time it also relaxes blood vessels, which lowers blood pressure.
sideEffectsCommon:
- needing to pee more
- feeling dizzy
- headache
- feeling sick
- being more sensitive to sunlight
sideEffectsSerious:
- muscle cramps, weakness, confusion or an irregular heartbeat, which can be signs of low potassium or sodium
- sudden eye pain or blurred vision
- a hot, swollen joint, which can be gout
- a new or changing skin patch or lump
stopping: It does not cause withdrawal symptoms, but your blood pressure is likely to rise again.
stoppingRisk: low
warnings:
- Long-term use is linked to a higher risk of some skin cancers. Protect your skin from the sun and check it regularly.
- You need regular blood tests to check your salts.
lastReviewed: '2026-10-05'
