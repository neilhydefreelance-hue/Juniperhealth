name: Paroxetine
alsoKnownAs:
- Seroxat
medicineType: SSRI antidepressant
forms:
- tablets
- liquid
summary: Paroxetine is an SSRI antidepressant. It treats depression and several anxiety conditions.
conditions:
- mental-health/depression
- mental-health/generalised-anxiety-disorder
- mental-health/ocd
- mental-health/ptsd
uses:
- Depression
- Panic disorder and social anxiety disorder
- Generalised anxiety disorder
- Obsessive compulsive disorder (OCD)
- Post-traumatic stress disorder (PTSD)
offLabel:
- Premature ejaculation
- Hot flushes during the menopause
howItWorks: Paroxetine is a selective serotonin reuptake inhibitor (SSRI). It increases serotonin in the brain, which helps regulate mood and anxiety.
sideEffectsCommon:
- feeling sick
- sweating
- feeling sleepy or having trouble sleeping
- dry mouth
- sexual problems
- weight gain
- yawning
sideEffectsSerious:
- thoughts of harming yourself or ending your life
- unusual bleeding or bruising
- signs of serotonin syndrome, such as confusion, high temperature and muscle twitching
stopping: Paroxetine is known for causing stronger withdrawal symptoms than many other antidepressants, because it leaves the body quickly. Symptoms include dizziness, electric shock feelings, anxiety, irritability and feeling sick. Your doctor will reduce the dose very slowly, sometimes using the liquid to make small reductions.
stoppingRisk: high
warnings:
- It is not usually recommended in pregnancy. Talk to your doctor before trying for a baby, but do not stop suddenly.
- Tell your doctor straight away if you feel worse or have thoughts of suicide, especially if you are under 25.
nhsSlug: paroxetine
lastReviewed: '2026-10-05'
