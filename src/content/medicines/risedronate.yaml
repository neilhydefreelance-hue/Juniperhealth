name: Risedronate
alsoKnownAs:
- Actonel
medicineType: Bisphosphonate (bone-strengthening medicine)
forms:
- tablets
summary: Risedronate strengthens bones. It lowers the risk of fractures in osteoporosis.
conditions:
- musculoskeletal/osteoporosis
uses:
- Treating and preventing osteoporosis after the menopause
- Osteoporosis in men
- Preventing bone loss in people taking long-term steroids
- Paget's disease of bone
offLabel: []
howItWorks: Risedronate slows down the cells that break down old bone. This lets bone-building cells catch up, so bones become denser and stronger.
sideEffectsCommon:
- indigestion
- stomach pain
- constipation or diarrhoea
- headache
- muscle and joint pain
sideEffectsSerious:
- pain or difficulty swallowing, chest pain or new heartburn
- jaw pain, a loose tooth or a mouth sore that does not heal
- new pain in your thigh, hip or groin
- ear pain or discharge
stopping: Risedronate does not cause withdrawal. Your doctor may suggest a "drug holiday" after about 5 years, depending on your fracture risk.
stoppingRisk: low
warnings:
- Take it first thing in the morning with a full glass of plain water, at least 30 minutes before food, drink or other medicines.
- Stay upright for 30 minutes after taking it.
- Have regular dental check-ups and tell your dentist you take it.
- Make sure you get enough calcium and vitamin D.
nhsSlug: risedronate
lastReviewed: '2026-10-05'
