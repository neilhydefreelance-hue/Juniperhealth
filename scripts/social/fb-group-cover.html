<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Lexend;src:url(../../public/fonts/lexend.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Atk;src:url(../../public/fonts/atkinson-next.woff2) format('woff2');font-weight:200 800}
*{margin:0;box-sizing:border-box}
/* Facebook group cover: 1640 x 856. Phones trim the edges, so everything important sits in the middle 1300 x 600. */
body{width:1640px;height:856px;overflow:hidden;position:relative;color:#fff;font-family:Atk;
 background:radial-gradient(900px 520px at 100% 0%,#8556b8 0%,transparent 70%),radial-gradient(700px 500px at 0% 100%,rgba(242,180,65,.16),transparent 70%),linear-gradient(135deg,#5b3494 0%,#432777 55%,#2e1a52 100%)}
.plant{position:absolute;right:-60px;bottom:-90px;width:560px;height:560px;color:rgba(255,255,255,.07)}
.inner{position:absolute;left:170px;right:170px;top:128px;bottom:128px;display:flex;align-items:center;gap:72px}
img{flex:none;width:330px;height:330px;border-radius:50%;box-shadow:0 24px 70px rgb(0 0 0/.35)}
.eyebrow{font-family:Lexend;font-weight:600;font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:#f2b441}
h1{margin-top:14px;font-family:Lexend;font-size:66px;line-height:1.08;font-weight:700;letter-spacing:-.01em}
p{margin-top:20px;font-size:29px;line-height:1.35;color:#ece5f7;max-width:820px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chip{padding:9px 20px;border-radius:999px;border:1.5px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);font-family:Lexend;font-size:22px}
.chip--url{background:#f2b441;border-color:#f2b441;color:#1e1b26;font-weight:600}
</style></head><body>
<svg class="plant" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 14c7 6 8 14 0 22-8-8-7-16 0-22z"/><path d="M50 23c2.6 2.4 2.6 5.6 0 8-2.6-2.4-2.6-5.6 0-8z"/><path d="M50 36v48"/><path d="M50 50 40.5 40.5"/><path d="M40.5 40.5c-8 0-12.5-6-11.5-13.5 7.5 0 12.5 5.5 11.5 13.5z"/><path d="M50 50l9.5-9.5"/><path d="M59.5 40.5c8 0 12.5-6 11.5-13.5-7.5 0-12.5 5.5-11.5 13.5z"/><path d="M50 76c0-5-2.5-8.5-6-10"/><path d="M44 66c-14 1.5-26-8-26-22 14-1.5 26 8 26 22z"/><path d="M41 62 25 48"/><path d="M50 76c0-5 2.5-8.5 6-10"/><path d="M56 66c14 1.5 26-8 26-22-14-1.5-26 8-26 22z"/><path d="M59 62l16-14"/></svg>
<div class="inner">
  <img src="../../docs/logo-master.png" alt="">
  <div>
    <div class="eyebrow">Community group</div>
    <h1>Health and disability support, in plain English</h1>
    <p>Share tips, ask questions and get help with health conditions, PIP, benefits and everyday support.</p>
    <div class="chips"><span class="chip">Kind and supportive</span><span class="chip">England and Wales</span><span class="chip chip--url">juniperhealth.info</span></div>
  </div>
</div>
</body></html>
